{% extends "base.html" %}
{% block title %}Upload document{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Upload document</h1><p class="muted">Allowed: PDF, TXT, MD, CSV, DOCX, XLSX, PPTX, PNG, JPG · max 10 MB</p></div></div>
<section class="card narrow">
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Title<input name="title" required value="{{ form.title }}"></label>
    <label>Description<textarea name="description" rows="3">{{ form.description }}</textarea></label>
    <div class="grid-2">
      <label>Category<select name="category">{% for c in CATEGORIES %}<option {{ 'selected' if c == form.category }}>{{ c }}</option>{% endfor %}</select></label>
      <label>Visible to<select name="clearance">{% for c in allowed %}<option value="{{ c }}" {{ 'selected' if c == form.clearance }}>{{ CLEARANCE_LABELS[c] }}</option>{% endfor %}</select></label>
    </div>
    <label>File<input type="file" name="file" required></label>
    <button class="btn" type="submit">Publish</button>
  </form>
</section>
{% endblock %}
